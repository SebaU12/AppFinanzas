server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: todas las rutas caen al index.html para que React Router funcione
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets con hash en el nombre (generados por Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
