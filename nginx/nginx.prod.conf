server {
    listen 80;

    # --- API: /api/... → backend uvicorn ---
    location /api/ {
        # Stripping /api/ antes de pasar al backend
        proxy_pass         http://finanzas-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Reescribir redirects del backend (ej: 307 /participants/ → /api/participants/)
        proxy_redirect     / /api/;
    }

    # --- Frontend: todo lo demas → archivos estaticos React ---
    location / {
        proxy_pass         http://finanzas-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
