server {
    listen 80;

    # Usar el DNS resolver interno de Docker para re-resolver IPs dinamicamente
    # (evita IPs cacheadas cuando los contenedores se recrean)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --- API: /api/... → backend uvicorn ---
    location /api/ {
        # Stripping /api/ antes de pasar al backend
        # (rewrite + break es necesario cuando proxy_pass usa variable)
        set $backend http://finanzas-backend:8000;
        # Agrega trailing slash a endpoints simples (/api/participants → /participants/)
        # para evitar que FastAPI haga 301 redirect que rompe CORS
        rewrite ^/api/([^/?]+)$ /$1/ break;
        rewrite ^/api/(.+)$ /$1 break;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- Frontend: todo lo demas → archivos estaticos React ---
    location / {
        # Sin trailing slash: nginx pasa el $request_uri completo al upstream
        set $frontend http://finanzas-frontend:80;
        proxy_pass         $frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
