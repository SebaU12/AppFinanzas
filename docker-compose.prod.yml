services:
  db:
    image: postgres:16
    container_name: finanzas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas}
      POSTGRES_USER: ${POSTGRES_USER:-finanzas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzas_pass_123}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - finanzas-network
    # Sin puerto expuesto al host — solo accesible internamente

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: finanzas-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-finanzas_user}:${POSTGRES_PASSWORD:-finanzas_pass_123}@db:5432/${POSTGRES_DB:-finanzas}
    depends_on:
      - db
    networks:
      - finanzas-network
    # Sin puerto expuesto al host — Nginx hace el proxy internamente

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # /api es relativo: el browser llama a http://IP:PUERTO/api/...
        # y Nginx lo redirige al backend. No necesita cambiar si cambia la IP.
        VITE_API_BASE_URL: /api
    container_name: finanzas-frontend
    restart: unless-stopped
    networks:
      - finanzas-network
    # Sin puerto expuesto al host — Nginx sirve los archivos estáticos

  nginx:
    image: nginx:alpine
    container_name: finanzas-nginx
    restart: unless-stopped
    ports:
      # Cambia 8765 al puerto que quieras usar para acceder desde el exterior.
      # El nginx interno siempre escucha en 80.
      - "8765:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finanzas-network

networks:
  finanzas-network:
    driver: bridge
